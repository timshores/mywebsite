<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!--
    Pixel art globe favicon — 16×16 grid, each "pixel" = 2×2 SVG units.
    Circle: center (7.5, 7.5), radius 7.
    Grid lines: equator (row 7), parallels (rows 4, 11), meridians (cols 5, 10).
    Body: #322E29  Lines: #FFFFFF
  -->

  <!-- Row 1: x=5–10 -->
  <rect x="10" y="2"  width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="2"  width="8"  height="2" fill="#322E29"/>
  <rect x="20" y="2"  width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->

  <!-- Row 2: x=4–11 -->
  <rect x="8"  y="4"  width="2"  height="2" fill="#322E29"/>
  <rect x="10" y="4"  width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="4"  width="8"  height="2" fill="#322E29"/>
  <rect x="20" y="4"  width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="22" y="4"  width="2"  height="2" fill="#322E29"/>

  <!-- Row 3: x=3–12 -->
  <rect x="6"  y="6"  width="4"  height="2" fill="#322E29"/>
  <rect x="10" y="6"  width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="6"  width="8"  height="2" fill="#322E29"/>
  <rect x="20" y="6"  width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="22" y="6"  width="4"  height="2" fill="#322E29"/>

  <!-- Row 4: upper parallel — x=2–13, all white -->
  <rect x="4"  y="8"  width="24" height="2" fill="#FFFFFF"/>

  <!-- Rows 5–6: x=1–14 (combined height 4) -->
  <rect x="2"  y="10" width="8"  height="4" fill="#322E29"/>
  <rect x="10" y="10" width="2"  height="4" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="10" width="8"  height="4" fill="#322E29"/>
  <rect x="20" y="10" width="2"  height="4" fill="#FFFFFF"/><!-- meridian -->
  <rect x="22" y="10" width="8"  height="4" fill="#322E29"/>

  <!-- Row 7: equator — x=1–14, all white -->
  <rect x="2"  y="14" width="28" height="2" fill="#FFFFFF"/>

  <!-- Rows 8–10: x=1–14 (combined height 6) -->
  <rect x="2"  y="16" width="8"  height="6" fill="#322E29"/>
  <rect x="10" y="16" width="2"  height="6" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="16" width="8"  height="6" fill="#322E29"/>
  <rect x="20" y="16" width="2"  height="6" fill="#FFFFFF"/><!-- meridian -->
  <rect x="22" y="16" width="8"  height="6" fill="#322E29"/>

  <!-- Row 11: lower parallel — x=2–13, all white -->
  <rect x="4"  y="22" width="24" height="2" fill="#FFFFFF"/>

  <!-- Row 12: x=3–12 -->
  <rect x="6"  y="24" width="4"  height="2" fill="#322E29"/>
  <rect x="10" y="24" width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="24" width="8"  height="2" fill="#322E29"/>
  <rect x="20" y="24" width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="22" y="24" width="4"  height="2" fill="#322E29"/>

  <!-- Row 13: x=4–11 -->
  <rect x="8"  y="26" width="2"  height="2" fill="#322E29"/>
  <rect x="10" y="26" width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="26" width="8"  height="2" fill="#322E29"/>
  <rect x="20" y="26" width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="22" y="26" width="2"  height="2" fill="#322E29"/>

  <!-- Row 14: x=5–10 -->
  <rect x="10" y="28" width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
  <rect x="12" y="28" width="8"  height="2" fill="#322E29"/>
  <rect x="20" y="28" width="2"  height="2" fill="#FFFFFF"/><!-- meridian -->
</svg>
