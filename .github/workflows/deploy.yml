name: Deploy to Namecheap

on:
  push:
    branches:
      - main

# One deploy at a time: overlapping FTP syncs can delete each other's files (2026-10-21, a
# stylesheet went missing). A newer push waits for the running deploy, then goes.
concurrency:
  group: deploy-namecheap
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Astro site
        run: npm run build
      
      - name: Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          # A fresh sync record (2026-10-21): the old one listed a stylesheet an overlapping deploy had
          # deleted. With no record, the action uploads every file and deletes nothing.
          state-name: .ftp-deploy-sync-state-v2.json